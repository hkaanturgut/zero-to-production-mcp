# main -> dev (automatic) -> prod (needs approval on the GitHub Environment "prod").
# Auth: OIDC federated credentials (create with `azd pipeline config`). No cloud secrets stored.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false  # never interrupt a running deployment

jobs:
  deploy:
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}   # prod waits here for a reviewer
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      DMS_API_KEY: ${{ secrets.DMS_API_KEY }}   # stable per environment, lands in Key Vault
    steps:
      - uses: actions/checkout@v5
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2   # az CLI, used by the postprovision hook (base image mirror)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in with OIDC
        run: |
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
      - name: Provision (idempotent)
        run: azd provision --no-prompt
      - name: Deploy
        run: azd deploy --no-prompt
      - name: Smoke test
        run: ./scripts/smoke.sh "$(azd env get-value MCP_URL)"
