# Reusable: apply Terraform for one environment, then smoke-test it.
name: deploy-env

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}   # approvals + env-scoped OIDC subject
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_acr_login_server: ${{ vars.ACR_LOGIN_SERVER }}
      TF_VAR_acr_id: ${{ vars.ACR_ID }}
      TF_VAR_manager_group_object_id: ${{ vars.MANAGER_GROUP_OBJECT_ID }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate-${{ inputs.env }}"
      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=10m
      - name: Smoke test
        run: |
          URL=$(terraform output -raw mcp_url)
          ../../../scripts/smoke.sh "$URL"
